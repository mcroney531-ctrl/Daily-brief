name: Send Daily Briefing

on:
  schedule:
    # Slow-but-reliable fallback only — GitHub's own scheduler has been
    # observed firing these 4-10+ hours late on this repo regardless of
    # which minute is picked (tried :30, :23, :08; all similarly late), so
    # this is no longer the primary trigger. That's now a Claude Routine
    # calling workflow_dispatch directly at 6:08 a.m. Eastern, which isn't
    # subject to GitHub's cron queue. Kept as a backstop in case the
    # Routine ever misses a day — the gate below makes both paths safe to
    # coexist, whichever fires first each day wins.
    - cron: "8 10 * * *"
    - cron: "8 11 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Internal — set by the precision Routine so its dispatch goes through the same 6am-ET gate as the cron fallback. Leave as false for a manual test send from the Actions tab, which bypasses the gate."
        required: false
        default: "false"

# Cron fallback and Routine dispatch can end up close together; run one at a
# time so the second sees the first's result before deciding whether to
# send again.
concurrency:
  group: send-daily-briefing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # First, so a run that shouldn't send costs nothing further. A bare
      # manual dispatch (clicking "Run workflow" with no input change) skips
      # the gate entirely so test sends always go through; the cron fallback
      # and Routine-triggered dispatches (scheduled=true) both go through it.
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          must_gate=false
          [ "${{ github.event_name }}" = "schedule" ] && must_gate=true
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.scheduled }}" = "true" ] && must_gate=true

          if [ "$must_gate" = "false" ]; then
            echo "Manual test dispatch — bypassing gate"
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=America/New_York date +%H)
          today_et=$(TZ=America/New_York date +%F)
          echo "Eastern hour is $hour, Eastern date is $today_et"

          sent_today=false
          if [ "$hour" -ge 6 ]; then
            # Widening the hour check to "6am onward" (rather than exactly
            # 6) means both this path and the cron fallback can land late
            # and still send — but that makes the workflow's own run
            # history untrustworthy as a "did we already send today"
            # signal, since a *skipped* run also reports overall conclusion
            # "success" (nothing failed, steps just didn't run). So check
            # whether the send step itself actually executed on a run from
            # today (ET), not just whether some run completed OK.
            resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/send.yml/runs?per_page=10")
            for id in $(echo "$resp" | jq -r '.workflow_runs[].id'); do
              created=$(echo "$resp" | jq -r --arg id "$id" '.workflow_runs[] | select(.id == ($id|tonumber)) | .created_at')
              run_et_date=$(TZ=America/New_York date -d "$created" +%F)
              [ "$run_et_date" != "$today_et" ] && continue
              step=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id/jobs" \
                | jq -r '.jobs[0].steps[]? | select(.name | test("index.ts")) | .conclusion')
              if [ "$step" = "success" ]; then
                sent_today=true
                break
              fi
            done
          fi

          if [ "$hour" -ge 6 ] && [ "$sent_today" = false ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.send == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.send == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.send == 'true'

      - run: npx tsx src/index.ts
        if: steps.gate.outputs.send == 'true'
        env:
          # ProjDash and quicksum-remote are open, unauthenticated MCP
          # endpoints (verified directly against their source, both the
          # Netlify and Railway deployments) — no token needed, safe to
          # keep as plain values here rather than repo secrets.
          PROJDASH_MCP_URL: https://project-tracker-mcp-production.up.railway.app/mcp
          QUICKSUM_MCP_URL: https://quicksum-mcp-production.up.railway.app/mcp

          # LinkHoard's auth status wasn't confirmed the same way (couldn't
          # verify API_TOKEN is set on Railway) — URL kept plain since a URL
          # alone isn't sensitive, but the token stays a secret in case one's
          # configured. Leave LINKHOARD_API_TOKEN unset in repo secrets if
          # there isn't one.
          LINKHOARD_API_URL: https://web-production-1b9bf.up.railway.app
          LINKHOARD_API_TOKEN: ${{ secrets.LINKHOARD_API_TOKEN }}

          # Sunday Setup's Supabase project, read directly. food_week_plans
          # has open anon select and this is the publishable (RLS-scoped)
          # key — public by design, so not a secret.
          FOOD_SUPABASE_URL: https://fdbkdsracxomwyytfgob.supabase.co
          FOOD_SUPABASE_KEY: sb_publishable_w5izyYtgIXD-pQvjlkn4jg_DtGJq_7j

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: mcroney531@gmail.com
