name: Menu DB check

# Manual only. Proves the restricted menu role can connect from GitHub
# Actions through the Supabase pooler over verified TLS, and that its
# permission boundary holds. Prints no credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/menu-db-check.ts
        env:
          FOOD_DB_URL: ${{ secrets.FOOD_DB_URL }}
          FOOD_DB_CA: ${{ secrets.FOOD_DB_CA }}
